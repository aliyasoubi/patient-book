<!doctype html>

    <meta charset="utf-8" />
    <title></title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00696e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#004f52" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="سامانه هوشمند مدیریت مطب دندانپزشکی" />
    <!--
      SVG first for every current browser, .ico as the fallback for the ones
      that still request /favicon.ico blind. Safari ignores SVG for the home
      screen, so apple-touch-icon has to be a real PNG.
    -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" sizes="32x32" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Dentixo" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>

</html>
