<div class="login">
  <div class="login__panel">
    <div class="login__brand">
      <mat-icon class="is-filled login__logo" aria-hidden="true">dentistry</mat-icon>
      <h1>{{ 'app.title' | translate }}</h1>
      <p>{{ 'app.description' | translate }}</p>
    </div>

    <mat-card class="login__card" appearance="outlined">
      @if (loading()) {
        <mat-progress-bar mode="indeterminate" class="login__progress" />
      }

      <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <h2 class="login__title">{{ 'auth.heading' | translate }}</h2>

          @if (errorMessage(); as message) {
            <div class="login__error" role="alert">
              <mat-icon aria-hidden="true">error</mat-icon>
              <span>{{ message }}</span>
            </div>
          }

          <pb-text-field
            [control]="form.controls.username"
            [label]="'auth.username' | translate"
            prefixIcon="person"
            [ltr]="true"
            nativeAutocomplete="username"
          />

          <pb-text-field
            [control]="form.controls.password"
            [label]="'auth.password' | translate"
            type="password"
            prefixIcon="lock"
            [ltr]="true"
            nativeAutocomplete="current-password"
          />

          <pb-button
            variant="flat"
            size="large"
            type="submit"
            icon="login"
            class="login__submit"
            [fullWidth]="true"
            [loading]="loading()"
            [loadingText]="'auth.signingIn' | translate"
          >
            {{ 'auth.signIn' | translate }}
          </pb-button>
        </form>
      </mat-card-content>
    </mat-card>

    <p class="login__footer">{{ 'auth.confidentialNotice' | translate }}</p>
  </div>
</div>
