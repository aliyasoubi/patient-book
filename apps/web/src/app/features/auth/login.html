<div class="login">
  <!-- Two hairline rings, a dot riding each, turning slowly behind the column. -->
  <div class="login__orbits" aria-hidden="true">
    <span class="login__orbit login__orbit--inner"><i></i></span>
    <span class="login__orbit login__orbit--outer"><i></i></span>
  </div>

  <main class="login__column" [class.is-shaking]="shaking()" (animationend)="stopShaking($event)">
    <!--
      A plain link (the app router would send `/` straight back to the
      dashboard), and out of the Tab order: on this page Tab walks only the
      fields and the button.
    -->
    <a class="login__brand" href="/" tabindex="-1" [attr.aria-label]="'auth.homeLink' | translate">
      <pb-logo [size]="44" [drawIn]="true" />
    </a>

    <!-- Each step's heading and fields share one cell and trade places: forward slides left, back right. -->
    <div class="login__stack login__heads login__rise" style="--d: 1">
      <header class="login__step" [class.is-active]="step() === 1" [attr.data-pos]="pos(1)">
        <h1 class="login__title" [attr.aria-hidden]="step() !== 1">
          {{ 'auth.heading' | translate }}
        </h1>
        <p class="login__subtitle" [attr.aria-hidden]="step() !== 1">
          {{ 'auth.subheading' | translate }}
        </p>
      </header>
      <header class="login__step" [class.is-active]="step() === 2" [attr.data-pos]="pos(2)">
        <h1 class="login__title" [attr.aria-hidden]="step() !== 2">
          {{ 'auth.welcome' | translate }}
        </h1>
        <p class="login__subtitle" [attr.aria-hidden]="step() !== 2">
          {{ 'auth.passwordStep' | translate }}
        </p>
      </header>
    </div>

    <form
      class="login__form login__rise"
      style="--d: 2"
      [formGroup]="form"
      (ngSubmit)="submit()"
      (keydown)="trackCapsLock($event)"
      (keyup)="trackCapsLock($event)"
      (keydown.escape)="step() === 2 && back()"
      novalidate
    >
      <!-- Both steps stay in the form, so a password manager sees an ordinary username + password pair. -->
      <div class="login__stack">
        <section
          class="login__step login__fields"
          [class.is-active]="step() === 1"
          [attr.data-pos]="pos(1)"
          [inert]="step() !== 1"
        >
          <pb-input
            [control]="form.controls.username"
            [label]="'auth.username' | translate"
            [showErrors]="tried().username"
            [hint]="'auth.usernameHint' | translate"
            prefixIcon="user"
            [ltr]="true"
            nativeAutocomplete="username"
          />
          <pb-button
            class="login__cta"
            variant="flat"
            size="large"
            type="submit"
            icon="arrow-left"
            [forward]="true"
            [raised]="true"
            [fullWidth]="true"
          >
            {{ 'auth.continue' | translate }}
          </pb-button>
        </section>

        <section
          class="login__step login__fields"
          [class.is-active]="step() === 2"
          [attr.data-pos]="pos(2)"
          [inert]="step() !== 2"
        >
          <div class="login__who">
            <span class="login__avatar" aria-hidden="true">{{ initial() }}</span>
            <span class="login__who-name" dir="ltr">{{ username() }}</span>
            <!-- Out of the Tab order too; Escape does the same from the keyboard. -->
            <button
              class="login__change"
              type="button"
              tabindex="-1"
              [attr.aria-label]="'auth.changeUser' | translate"
              (click)="back()"
            >
              <pb-icon name="pencil" [size]="16" />
            </button>
          </div>
          <pb-input
            [control]="form.controls.password"
            [label]="'auth.password' | translate"
            [showErrors]="tried().password"
            [toggleInTabOrder]="false"
            type="password"
            prefixIcon="lock"
            [ltr]="true"
            [hint]="(capsLock() ? 'auth.capsLock' : 'auth.passwordHint') | translate"
            nativeAutocomplete="current-password"
          />
          <pb-button
            class="login__cta"
            variant="flat"
            size="large"
            type="submit"
            icon="login-2"
            [forward]="true"
            [raised]="true"
            [fullWidth]="true"
            [loading]="loading()"
            [shrinkWhileLoading]="true"
            [loadingText]="'auth.signingIn' | translate"
          >
            {{ 'auth.signIn' | translate }}
          </pb-button>
        </section>
      </div>
    </form>
  </main>

  <p class="login__notice login__rise" style="--d: 4">
    <pb-icon name="shield-lock" [size]="14" />
    <span>{{ 'auth.confidentialNotice' | translate }}</span>
  </p>
</div>
