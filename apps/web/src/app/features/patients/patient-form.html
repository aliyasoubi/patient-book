<div class="form-page">
  <header class="form-page__header">
    <button mat-icon-button type="button" (click)="cancel()" i18n-aria-label aria-label="بازگشت">
      <span class="material-symbols-rounded" aria-hidden="true">arrow_forward</span>
    </button>
    <h1>{{ title() }}</h1>
  </header>

  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="form">
    <!-- ── Identity ──────────────────────────────────────────────── -->
    <pb-surface icon="badge" i18n-title title="هویت بیمار">
      <div class="grid">
        <pb-text-field
          [control]="form.controls.fileNo"
          i18n-label label="شماره پرونده"
          prefixIcon="folder"
          [ltr]="true"
          inputmode="numeric" />

        <pb-text-field [control]="form.controls.firstName" i18n-label label="نام" />

        <pb-text-field [control]="form.controls.lastName" i18n-label label="نام خانوادگی" />

        <pb-text-field [control]="form.controls.fatherName" i18n-label label="نام پدر" />

        <pb-text-field
          [control]="form.controls.nationalId"
          i18n-label label="کد ملی"
          [ltr]="true"
          inputmode="numeric"
          [maxlength]="10"
          i18n-hint hint="۱۰ رقم" />

        <pb-select-field
          [control]="form.controls.gender"
          [options]="genderOptions"
          i18n-label label="جنسیت" />

        <pb-date-field
          [control]="form.controls.birthDate"
          i18n-label label="تاریخ تولد"
          startView="multi-year"
          i18n-placeholder placeholder="۱۳۶۸/۰۵/۱۲"
          i18n-hint hint="تاریخ شمسی" />
      </div>
    </pb-surface>

    <!-- ── Contact ───────────────────────────────────────────────── -->
    <pb-surface icon="contact_phone" i18n-title title="اطلاعات تماس">
      <div class="grid">
        <pb-text-field
          [control]="form.controls.mobile"
          i18n-label label="شماره موبایل"
          prefixIcon="smartphone"
          [ltr]="true"
          inputmode="tel"
          [maxlength]="11"
          i18n-hint hint="مثال: ۰۹۱۲۱۲۳۴۵۶۷" />

        <pb-text-field
          [control]="form.controls.homePhone"
          i18n-label label="تلفن منزل"
          prefixIcon="call"
          [ltr]="true"
          inputmode="tel"
          [errorMessages]="homePhoneErrors" />

        <pb-textarea-field
          class="grid__full"
          [control]="form.controls.homeAddress"
          i18n-label label="آدرس منزل"
          [rows]="2" />

        <pb-textarea-field
          class="grid__full"
          [control]="form.controls.workAddress"
          i18n-label label="آدرس محل کار"
          [rows]="2" />
      </div>
    </pb-surface>

    <!-- ── Background ────────────────────────────────────────────── -->
    <pb-surface icon="badge" i18n-title title="اطلاعات تکمیلی">
      <div class="grid">
        <pb-text-field [control]="form.controls.occupation" i18n-label label="شغل" />

        <pb-select-field
          [control]="form.controls.education"
          [options]="educationOptions"
          i18n-label label="تحصیلات" />

        <pb-text-field
          [control]="form.controls.referralSourceName"
          i18n-label label="نحوه آشنایی"
          [options]="referralMatches()"
          i18n-hint hint="در صورت نبود، مورد جدید ساخته می‌شود" />

        <pb-date-field [control]="form.controls.firstVisitAt" i18n-label label="اولین مراجعه" />

        <pb-date-field [control]="form.controls.lastVisitAt" i18n-label label="آخرین مراجعه" />

        <pb-textarea-field
          class="grid__full"
          [control]="form.controls.medicalHistory"
          i18n-label label="سابقه بیماری قبلی"
          [rows]="2"
          prefixIcon="medical_information"
          i18n-placeholder placeholder="مثال: فشار خون، دیابت، مصرف داروی رقیق‌کننده خون" />
      </div>
    </pb-surface>

    <!-- ── Treatments ────────────────────────────────────────────── -->
    <pb-surface icon="dentistry" i18n-title title="درمان‌های انجام‌شده">
      <div class="treatments">
        @for (type of treatmentTypes(); track type.id) {
          <button
            type="button"
            class="treatment"
            [class.is-selected]="isSelected(type.code)"
            [style.--tx-bg]="color(type.color).bg"
            [style.--tx-fg]="color(type.color).fg"
            [attr.aria-pressed]="isSelected(type.code)"
            (click)="toggleTreatment(type.code)">
            <span class="material-symbols-rounded treatment__icon" aria-hidden="true">{{
              type.icon
            }}</span>
            <span class="treatment__label">{{ type.nameFa }}</span>
            @if (isSelected(type.code)) {
              <span class="material-symbols-rounded treatment__check" aria-hidden="true">check</span>
            }
          </button>
        }
      </div>
    </pb-surface>

    <!-- ── Notes ─────────────────────────────────────────────────── -->
    <pb-surface icon="edit_note" i18n-title title="یادداشت">
      <pb-textarea-field
        class="grid__full"
        [control]="form.controls.notes"
        i18n-label label="یادداشت داخلی"
        [rows]="3" />
    </pb-surface>

    <!-- ── Actions ───────────────────────────────────────────────── -->
    <div class="actions">
      <pb-button variant="text" type="button" (click)="cancel()" [disabled]="saving()" i18n>
        انصراف
      </pb-button>
      <pb-button
        variant="flat"
        type="submit"
        icon="save"
        [loading]="saving()"
        [loadingText]="savingLabel">
        {{ submitLabel() }}
      </pb-button>
    </div>
  </form>
</div>
