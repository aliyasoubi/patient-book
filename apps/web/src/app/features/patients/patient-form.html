<div class="form-page">
  <pb-page-header
    [title]="title() | translate"
    [backLabel]="'common.back' | translate"
    (back)="cancel()"
  />

  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="form">
    <!-- ── Identity ──────────────────────────────────────────────── -->
    <pb-surface icon="badge" [title]="'patientForm.identity' | translate">
      <div class="grid">
        <pb-text-field
          [control]="form.controls.fileNo"
          [label]="'patientForm.fileNumber' | translate"
          prefixIcon="folder"
          [ltr]="true"
          inputmode="numeric"
        />

        <pb-text-field
          [control]="form.controls.firstName"
          [label]="'patientForm.firstName' | translate"
          [options]="firstNameMatches()"
        />

        <pb-text-field
          [control]="form.controls.lastName"
          [label]="'patientForm.lastName' | translate"
          [options]="lastNameMatches()"
        />

        <pb-text-field
          [control]="form.controls.fatherName"
          [label]="'patientForm.fatherName' | translate"
        />

        <pb-text-field
          [control]="form.controls.nationalId"
          [label]="'patientForm.nationalId' | translate"
          [ltr]="true"
          inputmode="numeric"
          [maxlength]="10"
          [hint]="'patientForm.tenDigits' | translate"
        />

        <pb-select-field
          [control]="form.controls.gender"
          [options]="genderOptions"
          [label]="'patientForm.gender' | translate"
        />

        <pb-date-field
          [control]="form.controls.birthDate"
          [label]="'patientForm.birthDate' | translate"
          startView="multi-year"
          [placeholder]="'patientForm.birthDatePlaceholder' | translate"
          [hint]="'patientForm.jalaliDate' | translate"
        />
      </div>
    </pb-surface>

    <!-- ── Contact ───────────────────────────────────────────────── -->
    <pb-surface icon="contact_phone" [title]="'patientForm.contact' | translate">
      <div class="grid">
        <pb-text-field
          [control]="form.controls.mobile"
          [label]="'patientForm.mobile' | translate"
          prefixIcon="smartphone"
          [ltr]="true"
          inputmode="tel"
          [maxlength]="11"
          [hint]="'patientForm.mobileHint' | translate"
        />

        <pb-text-field
          [control]="form.controls.homePhone"
          [label]="'patientForm.homePhone' | translate"
          prefixIcon="call"
          [ltr]="true"
          inputmode="tel"
          [errorMessages]="homePhoneErrors()"
        />

        <pb-textarea-field
          class="grid__full"
          [control]="form.controls.homeAddress"
          [label]="'patientForm.homeAddress' | translate"
          [rows]="2"
        />

        <pb-textarea-field
          class="grid__full"
          [control]="form.controls.workAddress"
          [label]="'patientForm.workAddress' | translate"
          [rows]="2"
        />
      </div>
    </pb-surface>

    <!-- ── Background ────────────────────────────────────────────── -->
    <pb-surface icon="badge" [title]="'patientForm.additional' | translate">
      <div class="grid">
        <pb-text-field
          [control]="form.controls.occupation"
          [label]="'patientForm.occupation' | translate"
        />

        <pb-select-field
          [control]="form.controls.education"
          [options]="educationOptions"
          [label]="'patientForm.education' | translate"
        />

        <pb-text-field
          [control]="form.controls.referralSourceName"
          [label]="'patientForm.referral' | translate"
          [options]="referralMatches()"
          [hint]="'patientForm.newReferralHint' | translate"
        />

        <pb-date-field
          [control]="form.controls.firstVisitAt"
          [label]="'patientForm.firstVisit' | translate"
        />

        <pb-date-field
          [control]="form.controls.lastVisitAt"
          [label]="'patientForm.lastVisit' | translate"
        />

        <pb-textarea-field
          class="grid__full"
          [control]="form.controls.medicalHistory"
          [label]="'patientForm.medicalHistory' | translate"
          [rows]="2"
          prefixIcon="medical_information"
          [placeholder]="'patientForm.medicalHistoryPlaceholder' | translate"
        />
      </div>
    </pb-surface>

    <!-- ── Treatments ────────────────────────────────────────────── -->
    <pb-surface icon="dentistry" [title]="'patientForm.treatments' | translate">
      <div class="treatments">
        @for (type of treatmentTypes(); track type.id) {
          <button
            type="button"
            class="treatment"
            [class.is-selected]="isSelected(type.code)"
            [style.--tx-bg]="color(type.color).bg"
            [style.--tx-fg]="color(type.color).fg"
            [attr.aria-pressed]="isSelected(type.code)"
            (click)="toggleTreatment(type.code)"
          >
            <mat-icon class="treatment__icon" aria-hidden="true">{{ type.icon }}</mat-icon>
            <span class="treatment__label">{{ type.nameFa }}</span>
            @if (isSelected(type.code)) {
              <mat-icon class="treatment__check" aria-hidden="true">check</mat-icon>
            }
          </button>
        }
      </div>
    </pb-surface>

    <!-- ── Notes ─────────────────────────────────────────────────── -->
    <pb-surface icon="edit_note" [title]="'patientForm.notesSection' | translate">
      <pb-textarea-field
        class="grid__full"
        [control]="form.controls.notes"
        [label]="'patientForm.internalNotes' | translate"
        [rows]="3"
      />
    </pb-surface>

    <!-- ── Actions ───────────────────────────────────────────────── -->
    <div class="actions">
      <pb-button variant="text" type="button" (click)="cancel()" [disabled]="saving()">
        {{ 'common.cancel' | translate }}
      </pb-button>
      <pb-button
        variant="flat"
        type="submit"
        icon="save"
        [loading]="saving()"
        [loadingText]="'patientForm.savingLabel' | translate"
      >
        {{ submitLabel() | translate }}
      </pb-button>
    </div>
  </form>
</div>
