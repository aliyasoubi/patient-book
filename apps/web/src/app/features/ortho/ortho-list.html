<div class="registry-page">
  <pb-page-header
    i18n-title
    title="دفتر ارتودنسی"
    i18n-subtitle
    subtitle="شماره‌گذاری این دفتر مستقل از شماره پرونده اصلی است؛ عدد یکسان لزوماً به یک بیمار اشاره نمی‌کند."
    [count]="!loading() && total() > 0 ? (total() | faCount) + ' پرونده' : null"
  />

  <div class="registry-page__toolbar">
    <pb-search-field
      class="registry-page__search"
      [control]="search"
      i18n-placeholder
      placeholder="جستجوی شماره یا نام…"
      i18n-ariaLabel
      ariaLabel="جستجو در دفتر ارتودنسی"
    />

    <pb-checkbox-field
      [checked]="unlinkedOnly()"
      (checkedChange)="toggleUnlinked($event)"
      class="registry-page__filter"
      i18n
    >
      فقط بدون اتصال
    </pb-checkbox-field>
  </div>

  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <pb-registry-table
    [cases]="cases()"
    icon="straighten"
    [emptyTitle]="emptyTitle"
    [emptyHint]="emptyHint()"
    [canEdit]="false"
  />

  @if (total() > 0) {
    <mat-paginator
      [length]="total()"
      [pageIndex]="page() - 1"
      [pageSize]="limit()"
      [pageSizeOptions]="[10, 25, 50, 100]"
      (page)="onPage($event)"
      i18n-aria-label
      aria-label="صفحه‌بندی"
    />
  }
</div>
