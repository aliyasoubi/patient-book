<div class="account">
  <pb-page-header
    [title]="'account.title' | translate"
    [backLabel]="auth.user()?.mustChangePassword ? null : ('common.back' | translate)"
    (back)="back()"
  />

  @if (auth.user()?.mustChangePassword) {
    <p class="password-required" role="alert">
      {{ 'account.temporaryPasswordRequired' | translate }}
    </p>
  }

  <pb-surface>
    <div class="identity">
      <pb-avatar size="large" tone="primary" [name]="auth.user()?.fullName ?? ''" />
      <div>
        <strong>{{ auth.user()?.fullName }}</strong>
        <span class="identity__meta">
          <span class="ltr-nums">{{ auth.user()?.username }}</span>
          ·
          {{ roleLabel(auth.role()) | translate }}
        </span>
      </div>
    </div>
  </pb-surface>

  <pb-surface icon="key" [title]="'account.changePassword' | translate">
    <p class="panel__hint">{{ 'account.sessionsWarning' | translate }}</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="pw-form">
      <pb-text-field
        [control]="form.controls.currentPassword"
        [label]="'account.currentPassword' | translate"
        type="password"
        [ltr]="true"
        nativeAutocomplete="current-password"
        [errorMessages]="currentPasswordErrors()"
      />

      <pb-text-field
        [control]="form.controls.newPassword"
        [label]="'account.newPassword' | translate"
        type="password"
        [ltr]="true"
        nativeAutocomplete="new-password"
        [hint]="'account.newPasswordHint' | translate"
      />

      <pb-text-field
        [control]="form.controls.confirmPassword"
        [label]="'account.confirmPassword' | translate"
        type="password"
        [ltr]="true"
        nativeAutocomplete="new-password"
      />

      <div class="pw-form__actions">
        <pb-button
          variant="flat"
          type="submit"
          icon="save"
          [loading]="saving()"
          [loadingText]="'account.savingLabel' | translate"
        >
          {{ 'account.changePassword' | translate }}
        </pb-button>
      </div>
    </form>
  </pb-surface>
</div>
