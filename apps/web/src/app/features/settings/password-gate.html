<div class="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
  <!-- The app, blurred behind: it is there, just not yet. -->
  <div class="gate__scrim" aria-hidden="true"></div>

  <div class="gate__card">
    <span class="gate__badge gate__rise" style="--d: 0" aria-hidden="true">
      <pb-icon name="shield-lock" [size]="26" [stroke]="1.75" />
    </span>

    <h1 id="gate-title" class="gate__title gate__rise" style="--d: 1">
      {{ 'account.gateTitle' | translate }}
    </h1>
    <p class="gate__text gate__rise" style="--d: 2">
      {{ 'account.temporaryPasswordRequired' | translate }}
    </p>

    <form class="gate__form" [formGroup]="password.form" (ngSubmit)="password.submit()" novalidate>
      <pb-input
        class="gate__rise"
        style="--d: 3"
        [control]="password.form.controls.currentPassword"
        [label]="'account.currentPassword' | translate"
        [showErrors]="false"
        [readOnly]="password.saving()"
        [toggleInTabOrder]="false"
        type="password"
        prefixIcon="lock"
        [ltr]="true"
        nativeAutocomplete="current-password"
      />
      <pb-input
        class="gate__rise"
        style="--d: 4"
        [control]="password.form.controls.newPassword"
        [label]="'account.newPassword' | translate"
        [showErrors]="false"
        [readOnly]="password.saving()"
        [toggleInTabOrder]="false"
        type="password"
        prefixIcon="lock"
        [ltr]="true"
        nativeAutocomplete="new-password"
      />
      <pb-input
        class="gate__rise"
        style="--d: 5"
        [control]="password.form.controls.confirmPassword"
        [label]="'account.confirmPassword' | translate"
        [showErrors]="false"
        [readOnly]="password.saving()"
        [toggleInTabOrder]="false"
        type="password"
        prefixIcon="lock"
        [ltr]="true"
        nativeAutocomplete="new-password"
      />

      <pb-password-rules class="gate__rise" style="--d: 6" [rules]="password.rules()" />

      <pb-button
        class="gate__rise"
        style="--d: 7"
        variant="flat"
        size="large"
        type="submit"
        icon="check"
        [raised]="true"
        [fullWidth]="true"
        [shrinkWhileLoading]="true"
        [loading]="password.saving()"
        [loadingText]="'account.savingLabel' | translate"
      >
        {{ 'account.changePassword' | translate }}
      </pb-button>
    </form>

    <p class="gate__note gate__rise" style="--d: 8">{{ 'account.sessionsWarning' | translate }}</p>

    <button
      type="button"
      class="gate__leave gate__rise"
      style="--d: 9"
      tabindex="-1"
      (click)="logout()"
    >
      <pb-icon name="logout" [size]="16" />
      {{ 'app.logout' | translate }}
    </button>
  </div>
</div>
