<div class="registry-page">
  <pb-page-header
    [title]="'implant.title' | translate"
    [subtitle]="'registry.independentNumberNotice' | translate"
    [count]="countLabel()"
  />

  <div class="registry-page__toolbar">
    <pb-search-field
      class="registry-page__search"
      [control]="search"
      [placeholder]="'registry.searchPlaceholder' | translate"
      [ariaLabel]="'implant.searchAria' | translate"
    />

    <pb-checkbox-field
      [checked]="unlinkedOnly()"
      (checkedChange)="toggleUnlinked($event)"
      class="registry-page__filter"
    >
      {{ 'registry.unlinkedOnly' | translate }}
    </pb-checkbox-field>
  </div>

  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <pb-registry-table
    [cases]="cases()"
    icon="deployed_code"
    [emptyTitle]="'implant.emptyTitle' | translate"
    [emptyHint]="emptyHint()"
    [canEdit]="false"
  />

  @if (total() > 0) {
    <mat-paginator
      [length]="total()"
      [pageIndex]="page() - 1"
      [pageSize]="limit()"
      [pageSizeOptions]="[10, 25, 50, 100]"
      (page)="onPage($event)"
      [attr.aria-label]="'common.pagination' | translate"
    />
  }
</div>
