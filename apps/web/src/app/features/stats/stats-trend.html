<div class="trend__lead">
  <span class="trend__now">
    <strong>{{ trend().last.count | faCount }}</strong>
    {{ 'stats.newThisMonthShort' | translate }}
  </span>
  <span class="trend__max">{{
    'stats.maximum' | translate: { count: (trend().max | faCount) }
  }}</span>
</div>

<div class="trend__plot">
  @if (width()) {
    <svg
      class="trend__chart"
      [attr.width]="width()"
      [attr.height]="height"
      [attr.viewBox]="'0 0 ' + width() + ' ' + height"
      role="img"
      [attr.aria-label]="ariaLabel()"
      (pointermove)="track($event)"
    >
      @for (g of guides(); track g.value) {
        <line
          class="trend__guide"
          [class.trend__guide--base]="g.value === 0"
          x1="0"
          [attr.x2]="width()"
          [attr.y1]="g.y"
          [attr.y2]="g.y"
        />
        <text class="trend__scale" x="4" [attr.y]="g.y - 6">{{ g.value | faNum }}</text>
      }

      <path class="trend__area" [attr.d]="area()" />
      <path class="trend__line" [attr.d]="line()" pathLength="1" />

      @if (activePoint(); as p) {
        <line
          class="trend__cursor"
          [attr.x1]="p.x"
          [attr.x2]="p.x"
          [attr.y1]="20"
          [attr.y2]="height - 32"
        />
      }

      @for (p of points(); track p.month; let i = $index; let last = $last) {
        <circle
          class="trend__point"
          [class.is-now]="last"
          [class.is-active]="active() === i"
          [attr.cx]="p.x"
          [attr.cy]="p.y"
          [attr.r]="active() === i ? 5.5 : last ? 4.5 : 3"
          [attr.data-count]="p.count"
          [style.--_i]="i"
        />
        <text
          class="trend__month"
          [class.is-now]="last"
          [class.is-active]="active() === i"
          [attr.x]="p.x"
          [attr.y]="height - 10"
          text-anchor="middle"
        >
          {{ monthKey(p.month) | translate }}
        </text>
      }
    </svg>

    @if (activePoint(); as p) {
      <div
        class="trend__tip"
        aria-hidden="true"
        [style.inset-inline-start.px]="width() - p.x"
        [style.inset-block-start.px]="p.y"
      >
        <span class="trend__tip-month">{{ monthKey(p.month) | translate }}</span>
        <strong>{{ p.count | faCount }}</strong>
      </div>
    }
  } @else {
    <div class="trend__placeholder" [style.block-size.px]="height"></div>
  }
</div>
