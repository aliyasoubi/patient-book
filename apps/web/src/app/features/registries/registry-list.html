<pb-page class="registry-page" width="wide">
  <pb-page-header
    [title]="ui().title | translate"
    [subtitle]="'registry.independentNumberNotice' | translate"
    [count]="countLabel()"
  />

  <pb-list-toolbar>
    <pb-search-field
      [control]="search"
      [placeholder]="'registry.searchPlaceholder' | translate"
      [ariaLabel]="ui().searchAria | translate"
    />

    <!-- One sort key, the register number, so the order is a two-way
         switch: newest first or oldest first, both named, the current one
         lifted. -->
    <pb-switcher
      kind="radio"
      [options]="sortOptions"
      [value]="sortDir()"
      (valueChange)="setSort($event)"
      [ariaLabel]="'registry.sortByNumber' | translate"
    />

    <!-- Independent toggles on a list are M3 filter chips, not checkboxes. -->
    <pb-filter-chips
      multiple
      [options]="filterOptions()"
      [selected]="selectedFilters()"
      (selectedChange)="setFilters($event)"
      [ariaLabel]="'common.filters' | translate"
    />
  </pb-list-toolbar>


  <!-- A failed fetch keeps the previous rows (if any) under this banner; it is
       never rendered as the table's empty state, which would claim the
       register holds nothing. -->
  @if (failed()) {
    <pb-load-error
      [message]="
        (cases().length > 0 ? 'registry.loadFailedStale' : 'registry.loadFailed') | translate
      "
      (retry)="retry()"
    />
  }

  <!-- Rows already on screen stay through a reload or a failure; the table's
       own empty state only ever follows a completed, successful fetch. -->
  @if (!failed() || cases().length > 0) {
    <!-- A new page or page size: the list eases to its new height. -->
    <pb-auto-height>
    <pb-registry-table
      [loading]="loading()"
      [class.is-busy]="loading() && cases().length > 0"
      [cases]="cases()"
      [icon]="ui().icon"
      [emptyTitle]="ui().emptyTitle | translate"
      [emptyHint]="emptyHint()"
      [canEdit]="auth.can('editRegistry')"
      [canArchive]="auth.can('archiveRegistry')"
      [archived]="archivedOnly()"
      (edit)="edit($event)"
      (archive)="archive($event)"
      (restore)="restore($event)"
    />
    </pb-auto-height>
  }

  @if (total() > 0) {
    <pb-paginator
      [length]="total()"
      [page]="page()"
      [pageSize]="limit()"
      (pageChange)="onPage($event)"
    />
  }
</pb-page>
