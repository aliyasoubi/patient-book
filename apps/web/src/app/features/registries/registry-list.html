<div class="registry-page">
  <pb-page-header
    [title]="ui().title | translate"
    [subtitle]="'registry.independentNumberNotice' | translate"
    [count]="countLabel()"
  />

  <div class="registry-page__toolbar">
    <pb-search-field
      class="registry-page__search"
      [control]="search"
      [placeholder]="'registry.searchPlaceholder' | translate"
      [ariaLabel]="ui().searchAria | translate"
    />

    <!-- One sort key, so a direction toggle rather than a sort menu: the
         label names the key, the arrow shows the current order, and the
         accessible name says both. -->
    <button
      mat-stroked-button
      type="button"
      class="registry-page__sort"
      (click)="toggleSort()"
      [attr.aria-label]="
        (sortDir() === 'DESC' ? 'registry.sortDescAria' : 'registry.sortAscAria') | translate
      "
    >
      <mat-icon aria-hidden="true">{{ sortDir() === 'DESC' ? 'arrow_downward' : 'arrow_upward' }}</mat-icon>
      <span>{{ 'registry.sortByNumber' | translate }}</span>
    </button>

    <!-- Independent toggles on a list are M3 filter chips, not checkboxes. -->
    <mat-chip-listbox
      multiple
      class="registry-page__filter"
      [attr.aria-label]="'common.filters' | translate"
    >
      <mat-chip-option
        [selected]="unlinkedOnly()"
        (selectionChange)="toggleUnlinked($event.selected)"
      >
        <mat-icon matChipAvatar aria-hidden="true">link_off</mat-icon>
        {{ 'registry.unlinkedOnly' | translate }}
      </mat-chip-option>
      @if (auth.can('archiveRegistry')) {
        <mat-chip-option
          [selected]="archivedOnly()"
          (selectionChange)="toggleArchived($event.selected)"
        >
          <mat-icon matChipAvatar aria-hidden="true">inventory_2</mat-icon>
          {{ 'registry.archivedOnly' | translate }}
        </mat-chip-option>
      }
    </mat-chip-listbox>
  </div>

  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <!-- A failed fetch keeps the previous rows (if any) under this banner; it is
       never rendered as the table's empty state, which would claim the
       register holds nothing. -->
  @if (failed()) {
    <pb-load-error
      [message]="(cases().length > 0 ? 'registry.loadFailedStale' : 'registry.loadFailed') | translate"
      (retry)="retry()"
    />
  }

  <!-- Rows already on screen stay through a reload or a failure; the table's
       own empty state only ever follows a completed, successful fetch. -->
  @if ((!loading() && !failed()) || cases().length > 0) {
    <pb-registry-table
      [cases]="cases()"
      [icon]="ui().icon"
      [emptyTitle]="ui().emptyTitle | translate"
      [emptyHint]="emptyHint()"
      [canEdit]="auth.can('editRegistry')"
      [canArchive]="auth.can('archiveRegistry')"
      [archived]="archivedOnly()"
      (edit)="edit($event)"
      (archive)="archive($event)"
      (restore)="restore($event)"
    />
  }

  @if (total() > 0) {
    <mat-paginator
      [length]="total()"
      [pageIndex]="page() - 1"
      [pageSize]="limit()"
      [pageSizeOptions]="[10, 25, 50, 100]"
      (page)="onPage($event)"
      [attr.aria-label]="'common.pagination' | translate"
    />
  }
</div>
