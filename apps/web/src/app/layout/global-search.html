<form class="search" (submit)="onSubmit($event)" role="search">
  <pb-search-field
    #searchField
    [control]="control"
    [compact]="true"
    shortcut="Ctrl K"
    [loading]="loading()"
    [options]="searchOptions()"
    [showEmpty]="displayEmpty()"
    [emptyMessage]="emptyMessage"
    (optionSelected)="onSelect($event)"
    i18n-placeholder
    placeholder="جستجوی نام، شماره پرونده، موبایل یا کد ملی…"
    i18n-ariaLabel
    ariaLabel="جستجوی بیمار"
  />
</form>
