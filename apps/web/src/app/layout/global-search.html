@if (compact() && !expanded()) {
  <pb-icon-button
    class="search__open"
    icon="search"
    (click)="open()"
    [ariaLabel]="'globalSearch.aria' | translate"
    [tooltip]="'globalSearch.openTooltip' | translate"
  />
} @else {
  <form class="search" (submit)="onSubmit($event)" (focusout)="onFocusOut()" role="search">
    <pb-search-field
      #searchField
      [control]="control"
      [loading]="loading()"
      [options]="searchOptions()"
      [showEmpty]="displayEmpty()"
      [emptyMessage]="'globalSearch.empty' | translate"
      (optionSelected)="onSelect($event)"
      [placeholder]="'globalSearch.placeholder' | translate"
      [ariaLabel]="'globalSearch.aria' | translate"
    />
  </form>
}
