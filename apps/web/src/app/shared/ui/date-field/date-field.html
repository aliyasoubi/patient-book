@if (label()) {
  <label class="date__label" [for]="id">{{ label() }}</label>
}
<div class="date__anchor">
  <div class="date__box" [class.date__box--invalid]="showError()" [class.is-open]="open()">
    <pb-icon class="date__icon" name="calendar" />
    <input
      #field
      class="date__control"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      [id]="id"
      [class.date__control--words]="!!pretty()"
      [value]="pretty() ?? text()"
      [placeholder]="
        placeholder() ||
        ((focused() ? 'calendar.editPlaceholder' : 'calendar.placeholder') | translate)
      "
      [attr.aria-invalid]="showError() || null"
      [attr.aria-describedby]="message() || hint() ? messageId : null"
      [attr.aria-expanded]="open()"
      aria-haspopup="dialog"
      (input)="onInput($event)"
      (keydown)="onKeydown($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
    />
    <button
      type="button"
      class="date__toggle"
      [class.is-on]="open()"
      tabindex="-1"
      (click)="toggle()"
      [attr.aria-label]="'calendar.open' | translate"
    >
      <pb-icon name="chevron-down" [size]="18" />
    </button>
  </div>

  @if (open()) {
    <!-- Floating under the field; inside a dialog it opens in place instead,
         so the dialog grows to hold it rather than hiding it in a scroll. -->
    <div
      #popover
      class="date__popover"
      [class.is-above]="above() && !inline()"
      [class.is-inline]="inline()"
      role="dialog"
      [attr.aria-label]="label() || ('calendar.open' | translate)"
      [animate.enter]="inline() ? 'date__popover--grow' : 'date__popover--in'"
      [animate.leave]="inline() ? 'date__popover--shrink' : 'date__popover--out'"
    >
      <!-- A month of six weeks is a row taller than one of five: eased, not jumped. -->
      <pb-auto-height>
        <pb-shamsi-calendar
          [selected]="value()"
          [startView]="calendarView()"
          [showToday]="false"
          (dateChange)="pick($event)"
        />
      </pb-auto-height>
      <footer class="date__foot">
        <button type="button" class="date__chip" (click)="clear()">
          {{ 'calendar.clear' | translate }}
        </button>
        <button type="button" class="date__chip date__chip--primary" (click)="pickToday()">
          {{ 'calendar.today' | translate }}
        </button>
      </footer>
    </div>
  }
</div>
<!-- An error, or else the hint: always under the box, never inside it, where
     it would crowd the date and the example. -->
<div class="date__message-slot" [class.is-open]="!!message() || !!hint()">
  <p
    class="date__message"
    [class.date__message--error]="messageIsError()"
    [id]="messageId"
    [attr.aria-hidden]="message() || hint() ? null : 'true'"
  >
    {{ messageText() }}
  </p>
</div>
