<svg
  viewBox="0 0 48 48"
  [attr.width]="size()"
  [attr.height]="size()"
  fill="none"
  stroke="currentColor"
  [attr.stroke-width]="small() ? 5.5 : 4"
  stroke-linecap="round"
  stroke-linejoin="round"
  [attr.role]="label() ? 'img' : 'presentation'"
  [attr.aria-label]="label()"
  [attr.aria-hidden]="label() ? null : 'true'"
>
  <path class="pb-logo__tooth" pathLength="1" [attr.d]="toothPath()" />
  <path
    class="pb-logo__spark"
    [attr.d]="sparkPath()"
    fill="currentColor"
    [attr.stroke-width]="small() ? 3 : 2"
  />
</svg>
