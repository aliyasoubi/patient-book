<!--
  Maskable app-icon source (the manifest's `purpose: maskable`).

  Android crops this to whatever shape the launcher uses — circle, squircle,
  teardrop — keeping only the inner 80%. The mark is held to a smaller share
  of the canvas so no shape can clip it, and the tile runs full bleed so no
  mask can reveal a transparent corner.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="1024" height="1024" role="img" aria-label="Dentixo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00808a"/>
      <stop offset="1" stop-color="#004f52"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" fill="url(#tile)"/>
  <g transform="translate(24 24) scale(0.5) translate(-24.6 -23.7)" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 12C11 12 6 15.2 6 20.2c0 3.6.7 6.4 1.7 9.6C8.7 33 9.4 37.5 11.6 37.5c2 0 3-4.8 3.8-7.1.5-1.5 1.3-2.1 2.6-2.1s2.1.6 2.6 2.1c.8 2.3 1.8 7.1 3.8 7.1 2.2 0 2.9-4.5 3.9-7.7 1-3.2 1.7-6 1.7-9.6C30 15.2 25 12 18 12Z"/>
    <path fill="#fff" stroke-width="3" d="M39 8.6c.7 3.9 1.6 4.8 5.5 5.4-3.9.7-4.8 1.6-5.5 5.4-.7-3.9-1.6-4.8-5.5-5.4 3.9-.7 4.8-1.6 5.5-5.4Z"/>
  </g>
</svg>
