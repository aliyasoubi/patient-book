<!--
  Small-size variant of the mark, for anything rendered under ~24px: the
  favicon, a tab strip, a tray icon.

  Same silhouette, heavier stroke and a chunkier spark. The full-detail mark
  thins out and greys into mush at that size, which is the usual reason a
  logo looks fine in a deck and illegible in a browser tab.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Dentixo">
  <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 12C11 12 6 15.2 6 20.2c0 3.6.7 6.4 1.7 9.6C8.7 33 9.4 37.5 11.6 37.5c2 0 3-4.8 3.8-7.1.5-1.5 1.3-2.1 2.6-2.1s2.1.6 2.6 2.1c.8 2.3 1.8 7.1 3.8 7.1 2.2 0 2.9-4.5 3.9-7.7 1-3.2 1.7-6 1.7-9.6C30 15.2 25 12 18 12Z"/>
    <path fill="currentColor" stroke-width="3" d="M39 8.6c.7 3.9 1.6 4.8 5.5 5.4-3.9.7-4.8 1.6-5.5 5.4-.7-3.9-1.6-4.8-5.5-5.4 3.9-.7 4.8-1.6 5.5-5.4Z"/>
  </g>
</svg>
