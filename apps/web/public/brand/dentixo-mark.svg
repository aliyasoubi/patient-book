<!--
  Dentixo symbol mark — a tooth with a spark.

  Drawn on a 48x48 grid with a 4px stroke and round caps and joins, so it
  belongs to the same visual family as the Material Symbols Rounded set the
  rest of the product is built from.

  Stroked in `currentColor` on purpose: the app's primary colour differs
  between light and dark mode and the mark follows it rather than pinning
  one hex that drifts out of step.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Dentixo">
  <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 11C10.4 11 5 14.6 5 19.8c0 3.8.6 6.8 1.6 10.2C7.6 33.4 8.4 38 10.8 38c2.2 0 3.2-5 4-7.4.6-1.6 1.6-2.2 3.2-2.2s2.6.6 3.2 2.2c.8 2.4 1.8 7.4 4 7.4 2.4 0 3.2-4.6 4.2-8 1-3.4 1.6-6.4 1.6-10.2C31 14.6 25.6 11 18 11Z"/>
    <path fill="currentColor" stroke-width="2" d="M39 9.2c.5 3.4 1.4 4.1 4.6 4.6-3.2.5-4.1 1.2-4.6 4.6-.5-3.4-1.4-4.1-4.6-4.6 3.2-.5 4.1-1.2 4.6-4.6Z"/>
  </g>
</svg>
