<!--
  Primary logo, horizontal lockup.

  The wordmark is live text in Vazirmatn Bold — the one family the product
  already ships, so the logo pulls in no second font and matches the UI
  exactly. Anywhere the font cannot be guaranteed (print, someone else's
  deck), outline the text in a vector editor first.

  Clear space: keep a margin of at least 12 units — a quarter of the mark's
  height — on every side. Below about 120px wide, drop the wordmark and use
  the symbol mark alone.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 48" width="190" height="48" role="img" aria-label="Dentixo">
  <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
